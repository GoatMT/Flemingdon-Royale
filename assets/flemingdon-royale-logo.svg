<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
  <title id="title">LSL: Flemingdon Royale</title>
  <desc id="desc">An emerald and gold Lantern Soccer League battle royale emblem with a crown, Flemingdon skyline and supply crate.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0.18" y2="1">
      <stop offset="0" stop-color="#fff4b1"/><stop offset=".19" stop-color="#ffe27a"/><stop offset=".46" stop-color="#d99a16"/><stop offset=".62" stop-color="#fff0a0"/><stop offset=".82" stop-color="#bb7607"/><stop offset="1" stop-color="#ffe28a"/>
    </linearGradient>
    <linearGradient id="ivory" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fffef0"/><stop offset=".52" stop-color="#eee6cb"/><stop offset="1" stop-color="#b5aa89"/></linearGradient>
    <linearGradient id="emerald" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#087847"/><stop offset=".5" stop-color="#034527"/><stop offset="1" stop-color="#001c13"/></linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".45" stop-color="#aeb8b4"/><stop offset="1" stop-color="#53635c"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feGaussianBlur in="SourceAlpha" stdDeviation="13"/><feOffset dy="15"/><feComponentTransfer><feFuncA type="linear" slope=".65"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="9" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#075335"/><stop offset=".55" stop-color="#032719"/><stop offset="1" stop-color="#00150e"/></linearGradient>
  </defs>

  <!-- Emerald speed marks and the beveled title plate echo the original LSL game marks. -->
  <g opacity=".96" filter="url(#shadow)">
    <path d="M92 803 505 803 300 861 38 861Z" fill="url(#gold)" stroke="#062817" stroke-width="13"/>
    <path d="M174 854 653 854 469 903 106 903Z" fill="url(#emerald)" stroke="#d79b20" stroke-width="8"/>
    <path d="M91 467Q91 449 111 449H1175Q1200 449 1200 475V772Q1200 794 1178 794H423L366 839H89Z" fill="url(#plate)" stroke="#042b18" stroke-width="25" stroke-linejoin="round"/>
    <path d="M106 461H1174Q1185 461 1185 475V770Q1185 779 1175 779H421L360 824H106Z" fill="none" stroke="url(#gold)" stroke-width="8" stroke-linejoin="round"/>
  </g>

  <!-- Crown and LSL initials. -->
  <g filter="url(#shadow)" stroke-linejoin="round">
    <path d="M548 225 501 106 594 164 650 67 700 164 755 67 807 164 900 106 852 225 807 205 758 235 700 214 642 235 593 205Z" fill="url(#gold)" stroke="#062718" stroke-width="23"/>
    <path d="M548 225 501 106 594 164 650 67 700 164 755 67 807 164 900 106 852 225 807 205 758 235 700 214 642 235 593 205Z" fill="none" stroke="#ffdf78" stroke-width="5"/>
    <path d="M575 228Q700 194 825 228L799 257Q700 232 600 257Z" fill="url(#gold)" stroke="#062718" stroke-width="17"/>
    <g fill="url(#gold)" stroke="#5d3c04" stroke-width="8">
      <circle cx="501" cy="105" r="18"/><circle cx="650" cy="66" r="19"/><circle cx="755" cy="66" r="19"/><circle cx="900" cy="105" r="18"/>
    </g>
  </g>
  <text x="700" y="429" text-anchor="middle" font-family="Arial Black,Impact,sans-serif" font-size="225" font-weight="900" letter-spacing="8" fill="url(#gold)" stroke="#062315" stroke-width="26" paint-order="stroke" filter="url(#shadow)">LSL</text>
  <text x="700" y="429" text-anchor="middle" font-family="Arial Black,Impact,sans-serif" font-size="225" font-weight="900" letter-spacing="8" fill="url(#gold)" stroke="#fff0a0" stroke-width="3" paint-order="stroke">LSL</text>

  <!-- Neighborhood skyline and map-ring badge in place of the soccer ball. -->
  <g transform="translate(1083 585)" filter="url(#shadow)">
    <path d="M-13-130Q-35-172 6-208Q48-242 91-203Q126-169 101-130L55-66Z" fill="url(#gold)" stroke="#042719" stroke-width="17"/>
    <path d="M5-144Q-10-171 15-194Q39-216 64-193Q84-174 67-145L37-101Z" fill="#073d29" stroke="#ffe080" stroke-width="5"/>
    <circle cx="37" cy="-169" r="10" fill="#ffe080" filter="url(#glow)"/>
    <path d="M-102 31Q-83-74 18-91Q123-106 161-19Q193 55 130 126L61 190Q13 148-39 117Q-123 68-102 31Z" fill="url(#emerald)" stroke="url(#gold)" stroke-width="15"/>
    <path d="M-61 54V-3L-29-3V54M-19 54V-37L14-37V54M25 54V-17L58-17V54M69 54V-5L99-5V54" fill="#082619" stroke="#ffe6a0" stroke-width="5" stroke-linejoin="round"/>
    <path d="M-72 75H110M-49 96H91M-31 117H70" fill="none" stroke="#81c89b" stroke-width="5" opacity=".8"/>
    <path d="M-86 151Q-23 122 47 164" fill="none" stroke="#e5bb50" stroke-width="7" stroke-dasharray="8 13"/>
    <!-- compact supply crate -->
    <path d="M49 86 117 65 153 91 86 114Z" fill="url(#ivory)" stroke="#062718" stroke-width="8"/>
    <path d="M49 86V134L86 158V114Z" fill="url(#gold)" stroke="#062718" stroke-width="8"/>
    <path d="M86 114V158L153 132V91Z" fill="#087447" stroke="#062718" stroke-width="8"/>
    <path d="M85 114 86 157M51 110 117 87" fill="none" stroke="#fff0a0" stroke-width="5"/>
  </g>

  <!-- Title lettering keeps the cream, gold and dark-green LSL wordmark treatment. -->
  <text x="590" y="570" text-anchor="middle" font-family="Arial Black,Impact,sans-serif" font-size="105" font-weight="900" font-style="italic" letter-spacing="1" fill="url(#ivory)" stroke="#001c12" stroke-width="23" paint-order="stroke" filter="url(#shadow)">FLEMINGDON</text>
  <text x="585" y="746" text-anchor="middle" font-family="Arial Black,Impact,sans-serif" font-size="174" font-weight="900" font-style="italic" letter-spacing="1" fill="url(#gold)" stroke="#001c12" stroke-width="26" paint-order="stroke" filter="url(#shadow)">ROYALE</text>
  <text x="590" y="570" text-anchor="middle" font-family="Arial Black,Impact,sans-serif" font-size="105" font-weight="900" font-style="italic" letter-spacing="1" fill="url(#ivory)" stroke="#fff4c6" stroke-width="3" paint-order="stroke">FLEMINGDON</text>
  <text x="585" y="746" text-anchor="middle" font-family="Arial Black,Impact,sans-serif" font-size="174" font-weight="900" font-style="italic" letter-spacing="1" fill="url(#gold)" stroke="#ffe7a0" stroke-width="3" paint-order="stroke">ROYALE</text>
  <text x="635" y="872" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="800" letter-spacing="9" fill="#f5df9a" stroke="#002315" stroke-width="8" paint-order="stroke">DROP IN · RISE UP</text>
</svg>
